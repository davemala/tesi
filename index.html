<!-- html -->
<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Heart Rate Monitor</title>
    <style>
        body { font-family: "Montserrat Thin"; padding: 20px; }
        .bpm { font-size: 77px; font-weight: bold; }
        .time { color: #666; }
    </style>
</head>
<body>
<h1>Live Heart Rate</h1>
<div>Current BPM: <span id="bpm" class="bpm">--</span></div>
<div class="time" id="time">--</div>

<script>
    const evtSource = new EventSource('/api/hr/stream');
    evtSource.addEventListener('hr', event => {
        try {
            const data = JSON.parse(event.data);
            document.getElementById('bpm').textContent = data.bpm;
            const ts = new Date(data.timestamp || Date.now());
            document.getElementById('time').textContent = ts.toLocaleString();
        } catch (e) {
            console.error('Invalid HR event', e);
        }
    });

    evtSource.onerror = () => {
        console.error('EventSource failed');
    };
</script>
</body>
</html>
